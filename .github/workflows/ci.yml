name: ACEest Fitness CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build and lint
        run: |
          python -m py_compile app.py

      - name: Build Docker image
        run: |
          docker build -t aceest-fitness .

      - name: Run tests inside Docker container
        run: |
          docker run --rm aceest-fitness pytest

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push'
        run: |
          docker tag aceest-fitness ghcr.io/${{ github.repository_owner }}/aceest-fitness:latest

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/aceest-fitness:latest
