apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-variant-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-ab
      variant: a
  template:
    metadata:
      labels:
        app: aceest-ab
        variant: a
    spec:
      containers:
        - name: aceest-fitness
          image: 2025tm93180/aceest-fitness:v1.1.0
          ports:
            - containerPort: 5000
          imagePullPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-variant-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-ab
      variant: b
  template:
    metadata:
      labels:
        app: aceest-ab
        variant: b
    spec:
      containers:
        - name: aceest-fitness
          image: 2025tm93180/aceest-fitness:v1.2.0
          ports:
            - containerPort: 5000
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-variant-a-service
spec:
  type: NodePort
  selector:
    app: aceest-ab
    variant: a
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30083
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-variant-b-service
spec:
  type: NodePort
  selector:
    app: aceest-ab
    variant: b
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30084
