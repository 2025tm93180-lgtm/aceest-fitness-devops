apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow
  template:
    metadata:
      labels:
        app: aceest-shadow
    spec:
      containers:
        - name: aceest-fitness
          image: 2025tm93180/aceest-fitness:v1.2.0
          ports:
            - containerPort: 5000
          imagePullPolicy: Always
