apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bluegreen
      slot: blue
  template:
    metadata:
      labels:
        app: aceest-bluegreen
        slot: blue
    spec:
      containers:
        - name: aceest-fitness
          image: 2025tm93180/aceest-fitness:v1.1.0
          ports:
            - containerPort: 5000
          imagePullPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bluegreen
      slot: green
  template:
    metadata:
      labels:
        app: aceest-bluegreen
        slot: green
    spec:
      containers:
        - name: aceest-fitness
          image: 2025tm93180/aceest-fitness:v1.2.0
          ports:
            - containerPort: 5000
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bluegreen-service
spec:
  type: NodePort
  selector:
    app: aceest-bluegreen
    slot: blue
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30081
